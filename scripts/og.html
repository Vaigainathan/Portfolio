<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG — Vaigainathan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #090a0c;
        --text-strong: #ffffff;
        --text-muted: #a1a1aa;
        --accent-gold: #c8a96b;
        --glow: rgba(61, 214, 140, 0.1);
        --font-body: "Plus Jakarta Sans", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text-strong);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }

      .frame {
        width: 1200px;
        height: 630px;
        padding: 90px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        background-color: var(--bg);
        background-image: radial-gradient(
          900px 560px at 0% 0%,
          var(--glow) 0%,
          rgba(61, 214, 140, 0) 70%
        );
      }

      .kicker {
        display: flex;
        align-items: center;
        margin-bottom: 36px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-gold);
        flex-shrink: 0;
      }

      .kicker span {
        margin-left: 14px;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.14em;
        color: var(--accent-gold);
        line-height: 1;
      }

      h1 {
        margin-bottom: 28px;
        font-family: var(--font-body);
        font-weight: 800;
        font-size: 104px;
        letter-spacing: -0.03em;
        color: var(--text-strong);
        line-height: 1;
      }

      p {
        max-width: 900px;
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 36px;
        line-height: 1.4;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="kicker">
        <span class="dot" aria-hidden="true"></span>
        <span>BENGALURU, INDIA</span>
      </div>
      <h1>Vaigainathan</h1>
      <p>Websites, mobile apps and the systems behind them.</p>
    </div>
  </body>
</html>
